<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>串口调试助手</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar: Configuration -->
        <div class="sidebar">
            <div class="panel config-panel">
                <h3>串口设置</h3>
                <div class="form-group">
                    <label>端口号</label>
                    <select id="port-select">
                        <option value="">刷新中...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>波特率</label>
                    <select id="baud-rate">
                        <option value="9600">9600</option>
                        <option value="19200">19200</option>
                        <option value="38400">38400</option>
                        <option value="57600">57600</option>
                        <option value="115200" selected>115200</option>
                    </select>
                </div>
                <div class="form-group">
                    <button id="btn-open" class="btn btn-primary">打开串口</button>
                </div>
            </div>
        </div>

        <!-- Main Content: Display & Send -->
        <div class="main-content">
            <!-- Receive Area -->
            <div class="panel receive-panel">
                <div class="panel-header">
                    <span>接收区</span>
                    <div class="controls">
                        <label><input type="checkbox" id="chk-hex-show"> HEX显示</label>
                        <button id="btn-save-recv" class="btn btn-sm">保存</button>
                        <button id="btn-clear-recv" class="btn btn-sm">清空</button>
                    </div>
                </div>
                <div id="receive-area" class="text-area"></div>
            </div>

            <!-- Send Area -->
            <div class="panel send-panel">
                <div class="panel-header">
                    <span>发送区</span>
                    <div class="controls">
                        <label><input type="checkbox" id="chk-auto-send"> 自动发送</label>
                        <input type="number" id="input-auto-interval" value="1000" min="10" style="width: 60px; padding: 2px;"> ms
                        <label><input type="checkbox" id="chk-hex-send"> HEX发送</label>
                    </div>
                </div>
                <textarea id="send-area" class="text-area"></textarea>
                <div class="send-actions">
                    <button id="btn-send" class="btn btn-primary">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span id="status-text">未连接</span>
        <span id="status-info"></span>
    </div>

    <script src="./utils.js"></script>
    <script src="./app.js"></script>
</body>
</html>
