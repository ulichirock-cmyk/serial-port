<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>串口调试助手</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <div class="window-title-bar">
        <span class="window-title">串口调试助手</span>
    </div>
    <div class="container">
        <!-- Top Bar: Configuration -->
        <div class="top-bar">
            <div class="config-panel">
                <div class="form-inline">
                    <div class="form-group">
                        <label>端口:</label>
                        <select id="port-select">
                            <option value="">刷新中...</option>
                        </select>
                        <button id="btn-refresh-ports" class="btn btn-sm">刷新</button>
                    </div>
                    <div class="form-group">
                        <label>波特率:</label>
                        <select id="baud-rate">
                            <option value="1200">1200</option>
                            <option value="2400">2400</option>
                            <option value="4800">4800</option>
                            <option value="9600">9600</option>
                            <option value="14400">14400</option>
                            <option value="19200">19200</option>
                            <option value="38400">38400</option>
                            <option value="56000">56000</option>
                            <option value="57600">57600</option>
                            <option value="115200" selected>115200</option>
                            <option value="128000">128000</option>
                            <option value="230400">230400</option>
                            <option value="256000">256000</option>
                            <option value="460800">460800</option>
                            <option value="500000">500000</option>
                            <option value="512000">512000</option>
                            <option value="600000">600000</option>
                            <option value="750000">750000</option>
                            <option value="921600">921600</option>
                            <option value="1000000">1000000</option>
                            <option value="1500000">1500000</option>
                            <option value="2000000">2000000</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>主题:</label>
                        <select id="sel-theme">
                            <option value="default">默认蓝</option>
                            <option value="dark">暗黑模式</option>
                            <option value="green">护眼绿</option>
                            <option value="purple">专业紫</option>
                        </select>
                    </div>
                    <button id="btn-open" class="btn btn-primary btn-sm">打开串口</button>
                </div>
            </div>
        </div>

        <!-- Main Content: Display & Send -->
        <div class="main-content">
            <!-- Receive Area -->
            <div class="panel receive-panel">
                <div class="panel-header">
                    <span>接收区</span>
                    <div class="controls">
                        <button id="btn-toggle-search" class="btn btn-sm">搜索</button>
                        <button id="btn-toggle-filter" class="btn btn-sm">过滤规则 (0)</button>
                        <label><input type="checkbox" id="chk-auto-scroll" checked> 自动滚动</label>
                        <label><input type="checkbox" id="chk-hide-send" checked> 隐藏发送区</label>
                        <label><input type="checkbox" id="chk-hex-show"> HEX显示</label>
                        <button id="btn-save-recv" class="btn btn-sm">保存</button>
                        <button id="btn-clear-recv" class="btn btn-sm">清空</button>
                    </div>
                </div>
                <!-- Search Bar -->
                <div id="search-bar" class="search-bar" style="display: none;">
                    <div class="search-input-group">
                        <input type="text" id="input-search" placeholder="输入关键词搜索..." spellcheck="false">
                        <button id="btn-search-exec" class="btn btn-sm btn-primary">查找</button>
                        <span id="search-stats" class="search-stats"></span>
                    </div>
                    <button id="btn-search-close" class="btn btn-sm">&times;</button>
                </div>
                <!-- Filter Management Panel -->
                <div id="filter-manager" class="filter-manager" style="display: none;">
                    <div class="filter-input-row">
                        <select id="sel-filter-type">
                            <option value="include">包含</option>
                            <option value="exclude">排除</option>
                        </select>
                        <input type="text" id="input-new-filter" placeholder="输入关键词..." spellcheck="false">
                        <button id="btn-add-filter" class="btn btn-sm btn-primary">添加</button>
                    </div>
                    <div id="filter-tags" class="filter-tags">
                        <!-- Tags will be added here -->
                    </div>
                </div>
                <div class="receive-container" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
                    <div id="receive-area" class="text-area" style="flex: 1;"></div>
                    <!-- Resizer Handle -->
                    <div id="panel-resizer" class="panel-resizer" style="display: none;"></div>
                    <!-- Search Results Panel -->
                    <div id="search-results-panel" class="search-results-panel" style="display: none;">
                        <div class="search-results-header">搜索结果</div>
                        <div id="search-results-list" class="search-results-list"></div>
                    </div>
                </div>
            </div>

            <!-- Send Area -->
            <div id="send-panel-container" class="panel send-panel">
                <div class="panel-header">
                    <span>发送区</span>
                    <div class="controls">
                        <label><input type="checkbox" id="chk-auto-send"> 自动发送</label>
                        <input type="number" id="input-auto-interval" value="1000" min="10" style="width: 60px; padding: 2px;"> ms
                        <label><input type="checkbox" id="chk-hex-send"> HEX发送</label>
                    </div>
                </div>
                <textarea id="send-area" class="text-area"></textarea>
                <div class="send-actions">
                    <button id="btn-send" class="btn btn-primary">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span id="status-text">未连接</span>
        <span id="status-info"></span>
    </div>

    <script src="./utils.js"></script>
    <script src="./app.js"></script>
</body>
</html>
